# Builds web/ and deploys it to Azure Static Web Apps (Free tier).
# Setup: create the Static Web App in the Azure portal with "Other" as deployment source, then add
#   secret  AZURE_STATIC_WEB_APPS_API_TOKEN  (Static Web App → Manage deployment token)
#   vars    VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY  (hosted Supabase project → API settings)
# The Vite variables are baked in at build time; without them the app only shows a config error.
name: Deploy web

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/azure-static-web-apps.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: web
          output_location: dist
          api_location: ""
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
